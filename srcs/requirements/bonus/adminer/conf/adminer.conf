<VirtualHost *:8081>
    ServerName adminer.local
    DocumentRoot /var/www/adminer

    <Directory /var/www/adminer>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/adminer_error.log
    CustomLog ${APACHE_LOG_DIR}/adminer_access.log combined
</VirtualHost>
